name: Jarvis4
# The Jarvis 4 iPhone and iPad app: one native SwiftUI app (Deyao, 2026-10-11), Apple frameworks and our Swift only (no
# packages, no pods). `xcodegen generate` makes Jarvis4.xcodeproj (not in git).
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    # the router the app talks to; CI's simulator build overrides it on the xcodebuild line with the router on the runner
    JARVIS_BASE: "https://jarvis4.deyaochen.com/"
    # CI only (the simulator walkthrough's xcodebuild sets these): JARVIS_CI_FLAG=JARVIS_CI compiles in the code that
    # reads the key stand-in's address (KeySource.swift) and the router's test policy (PinnedPolicy); release builds
    # leave both empty
    JARVIS_CI_FLAG: ""
    JARVIS_CI_KEYS_BASE: ""
    # the phone replica only (ios.yml job `replica`): the git ref of DE0CH/jarvis4 the keys come from (KeySource.swift);
    # empty = main, and the TestFlight archive must leave it empty
    JARVIS_KEYS_REF: ""
targets:
  Jarvis4:
    type: application
    platform: iOS
    sources:
      - path: Jarvis4
      # which stores each harness brings, pinned in the app from git (PinnedPolicy, Security/LinePins.swift)
      - path: ../policy/stores.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.jarvis4
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(JARVIS_CI_FLAG)"
        PRODUCT_NAME: Jarvis4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Jarvis4/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Jarvis 4"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera takes a photo to send with a new session's first prompt."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID approves what Jarvis 4 asks you to sign and unlocks secret stores."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone and iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  Jarvis4UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Jarvis4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.jarvis4.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Jarvis4
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Jarvis4:
    build:
      targets:
        Jarvis4: all
    test:
      config: Release
      targets: [Jarvis4UITests]
