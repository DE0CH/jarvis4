# fly deploy -c services/log-shipper/fly.toml (docs/RUNBOOK.md "Logs and metrics"); secrets: ORG, ACCESS_TOKEN
# (a read-only token of org jarvis2-370), LOKI_URL, LOKI_USERNAME, LOKI_PASSWORD (the Grafana write token)
app = "jarvis2-log-shipper"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  SUBJECT = "logs.>"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
