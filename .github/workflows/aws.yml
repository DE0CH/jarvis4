# The session machines' AWS (infra/aws: per region the VPC, the security group and the launch template; the IAM users
# of the spawner and the router): OpenTofu plans and applies on every push that touches it, and daily to revert hand
# edits. State in R2 (backend in infra/aws/main.tf), locked with a lockfile; runs never overlap.
# Secrets: AWS_INFRA_ACCESS_KEY_ID / AWS_INFRA_SECRET_ACCESS_KEY (IAM user jarvis4-infra: EC2 and the /jarvis4/ IAM
# users only), DEYAO_TOFU_R2_ACCESS_KEY_ID / _SECRET_ACCESS_KEY (the state bucket).
name: aws
on:
  push:
    branches: [main]
    paths: [infra/aws/**, .github/workflows/aws.yml]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
concurrency: { group: aws, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: infra/aws } }
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      AWS_ACCESS_KEY_ID: ${{ secrets.DEYAO_TOFU_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEYAO_TOFU_R2_SECRET_ACCESS_KEY }}
      TF_VAR_aws_access_key: ${{ secrets.AWS_INFRA_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_key: ${{ secrets.AWS_INFRA_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: 1.10.6, tofu_wrapper: false }
      - run: tofu fmt -check -recursive
      - run: tofu init -lockfile=readonly
      - run: tofu validate
      - name: plan
        id: plan
        run: |
          set +e
          tofu plan -out=tfplan -detailed-exitcode -no-color > plan.txt 2>&1; code=$?
          cat plan.txt; echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: apply
        if: steps.plan.outputs.code == '2'
        run: tofu apply -no-color tfplan
      - name: plan failed
        if: steps.plan.outputs.code == '1'
        run: exit 1
