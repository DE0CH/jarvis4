# k8s.yml — every push touching k8s/ builds the one cluster's tree as its Flux applies it (k8s/cluster) and checks
# every Deployment is pinned: Flux prunes whatever a commit drops, so an emptied file would delete the router.
name: k8s
on:
  push:
    branches: [main]
    paths: [k8s/**, infra/router-secrets.py, .github/workflows/k8s.yml]
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          kubectl kustomize k8s/cluster > /tmp/cluster.yaml
          # every image by tag@digest, except the kernel and router before their first pin (":latest")
          bad="$(grep -E '^\s+image: ' /tmp/cluster.yaml | grep -vE '@sha256:[0-9a-f]{64}' | grep -vE 'jarvis4-(kernel|router):latest' || true)"
          [ -z "$bad" ] || { echo "not pinned by digest:"; echo "$bad"; exit 1; }
          if [ -f k8s/cluster/kernel/active-secrets.txt ]; then
            grep -Eqx 'blue|green' k8s/cluster/kernel/active-secrets.txt || { echo "active-secrets.txt names no colour"; exit 1; }
          fi
