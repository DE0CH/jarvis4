# gate.yml — the gate's one job (rust/gate), called by every agent-pushed repo's branch.yml and merge.yml (docs/DESIGN.md
# "Agent branches"; Deyao, 2026-11-18: an agent's change reaches main only when its CI is green). `open` runs on a
# branch push: the branch's pull request and the commit's `gate` status pending. `merge` runs when a workflow on a
# branch finishes (merge.yml's workflow_run, from the caller's main): green on main's head moves main to the tested
# commit with the caller's merge deploy key (environment `merge`, main only), green on an older base merges main into
# the branch. The binary is gate-release.yml's release, pinned below by its pin job.
name: gate
on:
  workflow_call:
    inputs:
      command: { type: string, required: true, description: "open | merge" }
      branch: { type: string, required: true }
      sha: { type: string, required: true }
      workflows: { type: string, default: "", description: "merge: the workflows that are the repo's CI, comma-separated (merge.yml's workflow_run list)" }
env:
  GATE_URL: https://github.com/DE0CH/jarvis4/releases/download/gate-unreleased/gate-x86_64-linux
  GATE_SHA256: unreleased
jobs:
  open:
    if: inputs.command == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: the gate binary
        run: curl -fsSL -o gate "$GATE_URL" && echo "$GATE_SHA256  gate" | sha256sum -c - && chmod +x gate
      - run: ./gate open
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_BRANCH: ${{ inputs.branch }}
          GATE_SHA: ${{ inputs.sha }}
          GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  merge:
    if: inputs.command == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: merge
    steps:
      - name: the gate binary
        run: curl -fsSL -o gate "$GATE_URL" && echo "$GATE_SHA256  gate" | sha256sum -c - && chmod +x gate
      - run: ./gate merge
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_BRANCH: ${{ inputs.branch }}
          GATE_SHA: ${{ inputs.sha }}
          GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_WORKFLOWS: ${{ inputs.workflows }}
          MERGE_DEPLOY_KEY: ${{ secrets.MERGE_DEPLOY_KEY }}
