name: aviary
# aviary/ (Jarvis 4's side of the aviary harness, aviary/README.md): fmt, clippy and the tests (against a TLS Postgres,
# as aviary-pg requires), then ghcr.io/de0ch/hermit-jarvis:sha-<12> and :latest (public: the services tenant pulls it
# without a login; DE0CH/services chat-pin.yml pins it). aviary-gateway goes into the session image (images.yml builds
# it from the same tree).
on:
  push:
    branches: [main]
    paths: [aviary/**, .github/workflows/aviary.yml]
  pull_request:
    paths: [aviary/**, .github/workflows/aviary.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
concurrency:
  group: aviary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aviary } }
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (aviary/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: postgres with TLS (aviary-pg connects with sslmode=require)
        run: |
          d=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=ci -keyout "$d/server.key" -out "$d/server.crt" 2>/dev/null
          pw=$(openssl rand -hex 16); printf '%s\n' "$pw" > "$d/pw"; chmod 0755 "$d"; chmod 0644 "$d"/*
          docker run -d --name pg -p 127.0.0.1:5432:5432 -v "$d:/ci:ro" postgres:18 bash -ec '
            bin=$(ls -d /usr/lib/postgresql/*/bin)
            su postgres -c "$bin/initdb -D /tmp/pgdata -U postgres --pwfile=/ci/pw -A scram-sha-256" >/dev/null
            cp /ci/server.crt /ci/server.key /tmp/pgdata/ && chown postgres /tmp/pgdata/server.* && chmod 0600 /tmp/pgdata/server.key
            printf "local all all trust\nhostssl all all all scram-sha-256\n" > /tmp/pgdata/pg_hba.conf
            exec su postgres -c "$bin/postgres -D /tmp/pgdata -c listen_addresses=* -c ssl=on -c fsync=off"' >/dev/null
          for _ in $(seq 1 60); do docker exec pg pg_isready -q -h 127.0.0.1 && break; sleep 1; done
          echo "::add-mask::$pw"
          echo "HERMIT_TEST_DATABASE_URL=postgres://postgres:$pw@127.0.0.1:5432/postgres?sslmode=require" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "SHORT=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: aviary
          push: true
          platforms: linux/amd64
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/DE0CH/jarvis4
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/de0ch/hermit-jarvis:sha-${{ env.SHORT }}
            ghcr.io/de0ch/hermit-jarvis:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/de0ch/hermit-jarvis
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
