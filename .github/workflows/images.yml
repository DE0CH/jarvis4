name: images
# Jarvis 4's kernel, router and session images to GHCR (ghcr.io/de0ch/jarvis4-*), tagged sha-<12> and latest, and the
# pin job's commit that moves k8s/cluster/ onto them by digest (Flux rolls them out on the one cluster). The router
# image carries the app's web export. The session image's base (session-image/base/: the tools, harnesses, entrypoint)
# is built only when that directory changed since the base it pins (or on a dispatch with base=true), pushed as
# jarvis4-session:base-sha-<12>, and pinned in session-image/Dockerfile's BASE by the pin job.
on:
  push:
    branches: [main]
    paths: [kernel/**, router/**, machine/**, session-image/**, policy/**, tasks/**, app/**, infra/setup.py, infra/setup_trust_test.py, infra/setup_write_test.py, infra/setup_roster_test.py, infra/kernel-pin.py, infra/kernel_pin_test.py, ios/interop/rostervec/**, infra/image-unpacked-size.py, .github/workflows/images.yml]
  workflow_dispatch:
    inputs:
      base:
        description: rebuild the session image's base (session-image/base/) even if it didn't change, e.g. for newer tools
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
concurrency: { group: images, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    # the router's tests need a Postgres (router/db_test.go: a schema per test); the same major as jarvis4-db
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env: { TEST_DATABASE_URL: "postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: cd kernel && go vet ./... && go test ./... && test -z "$(gofmt -l .)"
      - run: cd router && go vet ./... && go test ./...
      - run: cd machine && go vet ./... && go test ./...
      - run: pip install -q cryptography && python3 infra/setup_trust_test.py && python3 infra/setup_write_test.py && python3 infra/setup_roster_test.py && python3 infra/kernel_pin_test.py
  base:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # compares session-image/base/ against the commit of the pinned base
      - id: need
        run: |
          cur="$(grep -oE 'jarvis[24]-session:base-sha-[0-9a-f]*' session-image/Dockerfile | head -1 | cut -d- -f4)"
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.base }}" = true ]; then b=1
          elif [ -z "$cur" ] || ! full="$(git rev-parse -q --verify "$cur^{commit}")" || ! git diff --quiet "$full" "$GITHUB_SHA" -- session-image/base/; then b=1
          else b=0; fi
          echo "base pinned: ${cur:-none}; rebuild: $b"; echo "build=$b" >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.build == '1'
        name: free disk (the base is several GB; runners ship with ~14 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - if: steps.need.outputs.build == '1'
        uses: docker/setup-buildx-action@v3
      - if: steps.need.outputs.build == '1'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: tag
        run: echo "base=base-sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.build == '1'
        uses: docker/build-push-action@v6
        with:
          context: session-image/base
          file: session-image/base/Dockerfile
          push: true
          tags: ghcr.io/de0ch/jarvis4-session:${{ steps.tag.outputs.base }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=session-base
          cache-to: type=gha,mode=max,scope=session-base
      - id: ref
        if: steps.need.outputs.build == '1'
        run: echo "ref=$(infra/image-digest.sh "ghcr.io/de0ch/jarvis4-session:${{ steps.tag.outputs.base }}")" >> "$GITHUB_OUTPUT"
  build:
    needs: [test, base]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: kernel, context: kernel, file: kernel/Dockerfile }
          - { name: router, context: ., file: router/Dockerfile }
          - { name: session, context: ., file: session-image/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: web export (router image only)
        if: matrix.name == 'router'
        run: |
          mkdir -p web
          if [ -f app/package.json ]; then
            cd app && npm ci --no-audit --no-fund && npx expo export --platform web --output-dir ../web
          else
            echo '<!doctype html><title>Jarvis 4</title><p>Jarvis 4: the web page is not built yet.' > web/index.html
          fi
      - if: matrix.name == 'session'
        name: free disk space (the base image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # the session image on the base this run built (when it built one), else on the BASE the Dockerfile pins
          build-args: ${{ (matrix.name == 'session' && needs.base.outputs.ref) && format('BASE={0}', needs.base.outputs.ref) || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/de0ch/jarvis4-${{ matrix.name }}:${{ steps.tag.outputs.sha }}
            ghcr.io/de0ch/jarvis4-${{ matrix.name }}:latest
      - name: build attestation (what the iPhone will check for "CI build from <date>")
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/de0ch/jarvis4-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Fly pulls the session image with no credentials, so the package must be public; and Fly refuses an image that
      # doesn't fit 8 GiB once unpacked onto its filesystem (lessons/72): a failure here stops the pin job.
      - if: matrix.name == 'session'
        name: session image anonymously pullable and under Fly's unpack limit
        run: |
          set -e
          T="${{ steps.tag.outputs.sha }}"
          tok=$(curl -fsSL "https://ghcr.io/token?scope=repository:de0ch/jarvis4-session:pull" | jq -r .token)
          curl -fsS -o /dev/null -H "Authorization: Bearer $tok" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/de0ch/jarvis4-session/manifests/$T" \
            || { echo "::error::ghcr.io/de0ch/jarvis4-session:$T is not anonymously pullable: the package must be PUBLIC (Fly pulls without credentials)"; exit 1; }
          out=$(python3 infra/image-unpacked-size.py de0ch/jarvis4-session "$T" --top)
          echo "$out"
          disk=$(echo "$out" | tail -1 | jq .disk_bytes)
          if [ "$disk" -gt 8000000000 ]; then
            echo "::error::the session image needs $disk bytes on disk, over Fly's 8 GiB unpack limit: not pinned. Make session-image/base/ smaller."
            exit 1
          fi
  pin:
    needs: [base, build]
    # only main pins: the environment `release` admits refs/heads/main only, and holds the pin job's deploy key (the
    # one CI identity the main ruleset lets push) and the key that signs the session image for the phone (keys/ci.pub)
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ssh-key: "${{ secrets.PIN_DEPLOY_KEY }}" }  # the pin checks compare against older commits
      - uses: actions/setup-go@v5  # infra/kernel-pin.py reads each component's packages with go list
        with: { go-version: "1.25", cache: false }
      - name: pin the new images in k8s/cluster/ by digest (Flux rolls them out); never over a newer pin
        env: { CI_IMAGE_KEY: "${{ secrets.CI_IMAGE_KEY }}" }
        run: |
          T="sha-${GITHUB_SHA::12}"
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA isn't on main: nothing pinned"; exit 1; }
          git reset -q --hard origin/main
          RF=k8s/cluster/router/router.yaml
          KF=k8s/cluster/kernel/kernel.yaml
          # never over a newer pin: the router's (or, before the router is on the cluster, the kernel's) pinned build
          for f in "$RF" "$KF"; do
            [ -f "$f" ] || continue
            cur="$(grep -hoE 'jarvis4-(router|kernel):sha-[0-9a-f]{12}' "$f" | head -1 | grep -oE '[0-9a-f]{12}$' || true)"
            if [ -n "$cur" ] && full="$(git rev-parse -q --verify "$cur^{commit}")" && [ "$full" != "$GITHUB_SHA" ] \
               && git merge-base --is-ancestor "$GITHUB_SHA" "$full"; then echo "main already pins a newer build ($cur)"; exit 0; fi
            break
          done
          if [ -f "$RF" ]; then
            R="$(infra/image-digest.sh "ghcr.io/de0ch/jarvis4-router:$T")"
            sed -i -E "s#ghcr.io/de0ch/jarvis4-router:(latest|sha-[0-9a-f]{12}(@sha256:[0-9a-f]{64})?)#$R#g" "$RF"
            # the session image: the spawner starts only a source's own image, and the phone shows it as a CI build only
            # with this signature (the CI key, environment release; keys/ci.pub)
            S="$(infra/image-digest.sh "ghcr.io/de0ch/jarvis4-session:$T")"
            sed -i -E "s#ghcr.io/de0ch/jarvis4-session:(latest|sha-[0-9a-f]{12}(@sha256:[0-9a-f]{64})?)#$S#g" "$RF"
            k="$(mktemp)"; printf '%s\n' "$CI_IMAGE_KEY" > "$k"
            SIG="$(printf '%s' "jarvis2-session-image $S" | openssl dgst -sha256 -sign "$k" | base64 -w0)"; rm -f "$k"
            sed -i -E "s#(name: SESSION_IMAGE_SIG, value: \")[^\"]*#\1$SIG#" "$RF"
            grep -q "SESSION_IMAGE_SIG, value: \"$SIG\"" "$RF" || { echo "$RF has no SESSION_IMAGE_SIG line"; exit 1; }
            f=k8s/cluster/router/session-image-sigs.txt
            grep -q "^$S " "$f" || echo "$S $SIG" >> "$f"
          fi
          # the kernel: a release lands only on the copy that doesn't serve (active-kernel.txt names the one that does),
          # and only when the files a component's binary is built from changed since the build the serving copy pins AND
          # a commit after that carries Deyao's `Kernel-Release: <why> (Deyao, YYYY-MM-DD)` trailer: the changed
          # components get this build, the rest the serving copy's images, the whole copy replicas 1 and the hold
          # `jarvis2/kernel-release: pending`, which also stops the next release until the flip is committed. Changed
          # inputs with no release, or a release while one is in flight: this job fails after the router and session pins
          # are pushed, and no kernel Deployment moves (infra/kernel-pin.py; docs/RUNBOOK.md "A kernel release")
          krc=0
          if [ -f "$KF" ]; then
            KA="$(tr -d '[:space:]' < k8s/cluster/kernel/active-kernel.txt)"
            kmove="$(python3 infra/kernel-pin.py plan "$KF" "$KA" "$GITHUB_SHA")" || krc=1
            if [ "$krc" = 0 ] && [ -n "$kmove" ]; then
              K="$(infra/image-digest.sh "ghcr.io/de0ch/jarvis4-kernel:$T")"
              python3 infra/kernel-pin.py apply "$KF" "$KA" "$K" $kmove
            fi
          fi
          # the base this run built: the session image above stands on it, so session-image/Dockerfile's BASE moves to it
          B="${{ needs.base.outputs.ref }}"
          if [ -n "$B" ]; then
            sed -i -E "s#^ARG BASE=.*#ARG BASE=$B#" session-image/Dockerfile
            grep -qxF "ARG BASE=$B" session-image/Dockerfile || { echo "session-image/Dockerfile has no ARG BASE line"; exit 1; }
          fi
          git diff --quiet && exit "$krc"
          git config user.name "jarvis4-ci"; git config user.email "ci@jarvis4.invalid"
          git commit -qam "images: pin $T${B:+ + session base $(echo "$B" | grep -o "base-sha-[0-9a-f]*")} [skip ci]"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && exit "$krc"; git pull -q --rebase origin main; done
          exit 1
