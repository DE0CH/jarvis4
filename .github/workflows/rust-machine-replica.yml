name: rust-machine-replica
# The gate before the Rust jarvis-machine replaces machine/ (Deyao, 2026-11-17: Jarvis 4 rewritten in Rust part by
# part, each crate replacing its Go part once it passes that part's tests and the e2e replica): the session image the
# router pins now, with only jarvis-machine swapped for rust/machine's build (session-image/rust-machine.Dockerfile,
# ghcr.io/de0ch/jarvis4-session:rust-<sha12>), through a kernel line's life on real Fly machines (infra/e2e-kernel.sh:
# a new session on the kernel, pause with its snapshot, resume restoring it, destroy). Runs on every push to main that
# changes rust/ (or by hand); deleted with machine/ at the cut.
on:
  push:
    branches: [main]
    paths: [rust/**, session-image/rust-machine.Dockerfile, infra/e2e-kernel.sh, e2e/kernel/**, .github/workflows/rust-machine-replica.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: rust-machine-replica, cancel-in-progress: false }
jobs:
  replica:
    if: github.ref == 'refs/heads/main'
    # the Fly token of the phone replica (docs/RUNBOOK.md "The phone replica"): app jarvis4-sessions and the org's
    # WireGuard peers; main only
    environment: replica
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: the session image production runs
        id: img
        run: |
          set -euo pipefail
          s="$(grep -oE 'name: SESSION_IMAGE, value: "[^"]+"' k8s/cluster/router/router.yaml | head -1 | sed -E 's/.*value: "([^"]+)"/\1/')"
          [[ "$s" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::no pinned SESSION_IMAGE in k8s/cluster/router/router.yaml"; exit 1; }
          echo "session=$s" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/de0ch/jarvis4-session:rust-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: free disk space (the base image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: the candidate (the pinned image, the Rust jarvis-machine)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: session-image/rust-machine.Dockerfile
          build-args: SESSION=${{ steps.img.outputs.session }}
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.img.outputs.image }}
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache: false }
      - name: tools (crane, flyctl)
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -fsSL https://fly.io/install.sh | sh > /dev/null
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: a kernel line's life on the candidate (infra/e2e-kernel.sh)
        env:
          JARVIS2_FLY_TOKEN: ${{ secrets.REPLICA_FLY_TOKEN }}
          E2E_SESSION_IMAGE: ${{ steps.img.outputs.image }}
          E2E_LOGS: /tmp/e2e-kernel-logs
        run: |
          [ -n "$JARVIS2_FLY_TOKEN" ] || { echo "::error::secret REPLICA_FLY_TOKEN is missing from the GitHub environment 'replica'"; exit 1; }
          infra/e2e-kernel.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-kernel-logs, path: /tmp/e2e-kernel-logs, retention-days: 7, if-no-files-found: ignore }
