name: services
# Jarvis 4's shared services (services/search, services/icloud-index, services/watch) to GHCR as ghcr.io/de0ch/jarvis4-<name>, tagged
# sha-<12> and latest (their unit tests run inside the image build), then pinned by the linux/amd64 digest in every
# manifest that names the image (k8s/cluster/services/<name>/; a commit by this workflow; Flux rolls them out). Only the service whose files changed is
# built and pinned, so a search change never restarts the iCloud index.
on:
  push:
    branches: [main]
    paths: [services/**, .github/workflows/services.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
concurrency: { group: services, cancel-in-progress: false }
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs: { names: "${{ steps.c.outputs.names }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: c
        run: |
          names=()
          for n in search icloud-index watch; do
            # a dispatch, a change in the service, or no pin yet (sha-000000000000) builds it
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || grep -rqs "jarvis4-$n:sha-000000000000" k8s/cluster/services \
               || ! git diff --quiet "${{ github.event.before }}" "$GITHUB_SHA" -- "services/$n" .github/workflows/services.yml 2>/dev/null; then names+=("\"$n\""); fi
          done
          echo "names=[$(IFS=,; echo "${names[*]}")]" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: needs.changes.outputs.names != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.changes.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.name }}
          push: true
          labels: org.opencontainers.image.source=https://github.com/DE0CH/jarvis4
          tags: |
            ghcr.io/de0ch/jarvis4-${{ matrix.name }}:${{ steps.tag.outputs.sha }}
            ghcr.io/de0ch/jarvis4-${{ matrix.name }}:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/de0ch/jarvis4-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  pin:
    needs: [changes, build]
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ssh-key: "${{ secrets.PIN_DEPLOY_KEY }}" }
      - name: pin the new images by digest in every manifest naming them; never over a newer pin
        env: { NAMES: "${{ join(fromJson(needs.changes.outputs.names), ' ') }}" }
        run: |
          T="sha-${GITHUB_SHA::12}"
          git config user.name "jarvis4-ci"; git config user.email "ci@jarvis4.invalid"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA isn't on main: nothing pinned"; exit 1; }
            git reset -q --hard origin/main
            for n in $NAMES; do
              files="$(grep -rlE "ghcr.io/de0ch/jarvis4-$n:sha-" k8s/cluster/services 2>/dev/null)"
              [ -n "$files" ] || { echo "$n: no manifest names it"; continue; }
              cur="$(grep -ho "jarvis4-$n:sha-[0-9a-f]*" $files | head -1 | cut -d: -f2 | cut -d- -f2)"
              if [ "$cur" != 000000000000 ] && full="$(git rev-parse -q --verify "$cur^{commit}")" && [ "$full" != "$GITHUB_SHA" ] \
                 && git merge-base --is-ancestor "$GITHUB_SHA" "$full"; then echo "$n: main already pins a newer build ($cur)"; continue; fi
              D="$(infra/image-digest.sh "ghcr.io/de0ch/jarvis4-$n:$T")"
              sed -i -E "s#ghcr.io/de0ch/jarvis4-$n:sha-[0-9a-f]{12}(@sha256:[0-9a-f]{64})?#$D#g" $files
            done
            git diff --quiet && exit 0
            git commit -qam "services: pin $T ($NAMES) [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
