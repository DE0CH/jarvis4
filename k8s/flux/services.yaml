# The SERVICES box's Flux sync (docs/DESIGN.md "The boxes"), applied once by infra/cloud-init.sh (BOX_KIND=services);
# not reconciled (a change here needs a rebuilt box). Flux pulls this public repo every minute and applies each app of
# ./k8s/services/apps as its own Kustomization, so one manifest Flux refuses blocks only that app (2026-10-15: one
# refused RoleBinding held every rollout back for 40 min), all as the limited flux-applier identity
# (k8s/bootstrap-services), and the SOPS-encrypted ./k8s/services/secrets with the box's age key.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: { name: jarvis2, namespace: flux-system }
spec:
  interval: 1m
  url: https://github.com/DE0CH/jarvis4
  ref: { branch: main }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: services-secrets, namespace: flux-system }
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef: { kind: GitRepository, name: jarvis2 }
  path: ./k8s/services/secrets
  prune: true
  wait: false
  serviceAccountName: flux-applier
  decryption:
    provider: sops
    secretRef: { name: sops-age }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: services-search, namespace: flux-system }
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef: { kind: GitRepository, name: jarvis2 }
  path: ./k8s/services/apps/search
  prune: true
  wait: false
  serviceAccountName: flux-applier
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: services-watch, namespace: flux-system }
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef: { kind: GitRepository, name: jarvis2 }
  path: ./k8s/services/apps/watch
  prune: true
  wait: false
  serviceAccountName: flux-applier
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: services-icloud-index, namespace: flux-system }
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef: { kind: GitRepository, name: jarvis2 }
  path: ./k8s/services/apps/icloud-index
  prune: true
  wait: false
  serviceAccountName: flux-applier
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: services-poc, namespace: flux-system }
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef: { kind: GitRepository, name: jarvis2 }
  path: ./k8s/services/apps/poc
  prune: true
  wait: false
  serviceAccountName: flux-applier
