# The kernel on the one cluster (DESIGN "Target design", docs/PLAN-cluster.md "The roster" and "Releases: the copy
# flip"): two copies, blue and green, of its nine components, one binary each from ghcr.io/de0ch/jarvis4-kernel, each its
# own Deployment ("<role>-<copy>") so a bug in one can't read another's memory. No box key: each component makes fresh
# keys in RAM at start and answers them at GET /identity; the root key (the Jarvis 4 app's) vouches for a copy's
# components in that copy's roster, which the router posts (POST /roster) and every component checks against
# KERNEL_ROOT (the ConfigMap kernel-root, made from root.pub here = keys/root.pub; infra/setup.py kernel-root-key).
# One copy serves (active-kernel.txt, and the router's state); a kernel release goes only into the other (the images
# workflow's pin job, infra/kernel-pin.py: the release's builds and the serving copy's images for the rest, replicas 1,
# and the hold `jarvis2/kernel-release: pending`). Once Deyao signs that copy's roster the router flips: every serving
# component hands over and freezes, the notarizer's, the spawner's and secrets' state moves to the other copy
# (router/kernelflip.go). Then infra/setup.py kernel-flipped names the new serving copy in active-kernel.txt, deletes its
# hold and scales the old copy to zero until the next release lands on it. The copy label is `color` (a Deployment's
# selector can't change, and secrets-blue/-green had it before the copies). A copy that pins no build (`:latest`) has
# never been released: the pin job pins the serving one in place (the bootstrap, RUNBOOK "The first rollout of the two
# copies"); the other stays `:latest` at replicas 0 until a release copies the serving images into it.
# State: the notary's log, the notarizer's sources and the spawner's machines live on each copy's own volumes
# (Recreate: one writer); mover, merger, the two signers and the minter hold nothing; secrets holds the stores in memory
# only. Only the router (and kernel-id, GET /identity only) reaches them, and each copy's secrets its own minter; only
# the spawner (Fly) and the minter (GitHub deploy keys: secrets hands it the token, DECISIONS 232) reach the internet.
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis4-kernel
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: kernel }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: notary-blue-data, namespace: jarvis4-kernel }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notary-blue, namespace: jarvis4-kernel }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kernel, role: notary, color: blue } }
  template:
    metadata: { labels: { app: kernel, role: notary, color: blue, egress: "none" } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: notary
          image: ghcr.io/de0ch/jarvis4-kernel:sha-d295bee65b13@sha256:b8b358e35e88fbb0f3ec0198eb4ac2370f9df4de9adcf6e27e1c246d14c9f0a9
          command: ["/kernel/notary"]
          ports: [{ containerPort: 8080 }]
          env: [{ name: KERNEL_ROOT, valueFrom: { configMapKeyRef: { name: kernel-root, key: root.pub } } }, { name: KERNEL_DATA, value: /data }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /identity, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
      securityContext: { fsGroup: 65532 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: notary-blue-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: notary-blue, namespace: jarvis4-kernel }
spec:
  selector: { app: kernel, role: notary, color: blue }
  ports: [{ port: 8080, targetPort: 8080 }]
---
