# The kernel on the one cluster (DESIGN "Target design", docs/PLAN-cluster.md "The roster"): nine components, one
# binary each from ghcr.io/de0ch/jarvis4-kernel, each its own Deployment so a bug in one can't read another's memory.
# No box key: each component makes fresh keys in RAM at start and answers them at GET /identity; the root key (the
# Jarvis 4 app's) vouches for them in the roster the router posts (POST /roster), which every component checks against
# KERNEL_ROOT (the ConfigMap kernel-root, made from root.pub here = keys/root.pub; infra/setup.py kernel-root-key).
# A restart makes new keys: the router says the roster is stale until Deyao signs a new one (router/roster.go).
# State: the notary's log, the notarizer's sources and the spawner's machines live on their own volumes (Recreate:
# one writer; the router retries a kernel call through the seconds a restart takes). Mover, merger, the two signers
# and the minter hold nothing. Secrets holds the stores in memory only, so it runs blue and green: one serves (the router's state,
# kernelSecrets), the other is next; a release goes only into the next (active-secrets.txt names the serving one for
# the pin job in .github/workflows/images.yml), Deyao Recovers it alongside and the router flips (router/kernel.go).
# Only the router (and kernel-id, GET /identity only) reaches them, and secrets the minter; only the spawner (Fly) and
# the minter (GitHub deploy keys: secrets hands it the token, DECISIONS 230) reach the internet. The image is pinned by digest by the images workflow's pin job whenever kernel/ changed.
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis4-kernel
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: kernel }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: notary-data, namespace: jarvis4-kernel }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notary, namespace: jarvis4-kernel }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kernel, role: notary } }
  template:
    metadata: { labels: { app: kernel, role: notary, egress: "none" } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: notary
          image: ghcr.io/de0ch/jarvis4-kernel:sha-dcc425b899c7@sha256:5486ff2afdf1cbd084cf40d018a7ab1b79ad7725a0af51df3bce361616e9ab8c
          command: ["/kernel/notary"]
          ports: [{ containerPort: 8080 }]
          env: [{ name: KERNEL_ROOT, valueFrom: { configMapKeyRef: { name: kernel-root, key: root.pub } } }, { name: KERNEL_DATA, value: /data }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /identity, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
      securityContext: { fsGroup: 65532 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: notary-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: notary, namespace: jarvis4-kernel }
spec:
  selector: { app: kernel, role: notary }
  ports: [{ port: 8080, targetPort: 8080 }]
---
