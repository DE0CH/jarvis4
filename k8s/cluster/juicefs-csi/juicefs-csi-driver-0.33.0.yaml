# Source: juicefs-csi-driver/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: node
    helm.sh/chart: juicefs-csi-driver-0.33.0
    app.kubernetes.io/name: juicefs-csi-driver
    app.kubernetes.io/instance: juicefs-csi-driver
    app.kubernetes.io/version: "0.33.0"
    app.kubernetes.io/managed-by: Helm
  name: juicefs-csi-node
  namespace: "kube-system"
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 50%
  selector:
    matchLabels:
      app: juicefs-csi-node
      app.kubernetes.io/name: juicefs-csi-driver
      app.kubernetes.io/instance: juicefs-csi-driver
  template:
    metadata:
      labels:
        app: juicefs-csi-node
        app.kubernetes.io/name: juicefs-csi-driver
        app.kubernetes.io/instance: juicefs-csi-driver
    spec:
      containers:
      - name: juicefs-plugin
        image: juicedata/juicefs-csi-driver:v0.33.0
        args:
        - --endpoint=$(CSI_ENDPOINT)
        - --logtostderr
        - --nodeid=$(NODE_NAME)
        - --enable-manager=true
        - --config=/etc/config/config.yaml
        env:
        - name: CSI_ENDPOINT
          value: unix:/csi/csi.sock
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: JUICEFS_MOUNT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: KUBELET_PORT
          value: "10250"
        - name: JUICEFS_MOUNT_PATH
          value: /var/lib/juicefs/volume
        - name: JUICEFS_CONFIG_PATH
          value: /var/lib/juicefs/config
        - name: FS_SHARE_MOUNT
          value: "true"
        - name: JUICEFS_MOUNT_PRIORITY_NAME
          value: "juicefs-mount-priority-nonpreempting"
        - name: JUICEFS_MOUNT_PREEMPTION_POLICY
          value: "Never"
        - name: JUICEFS_CE_MOUNT_IMAGE
          value: juicedata/mount:ce-v1.4.1
        - name: JUICEFS_CSI_WEB_PORT
          value: "9567"
        - name: DRIVER_NAME
          value: "csi.juicefs.com"
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 9909
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 384Mi
          requests:
            cpu: 20m
            memory: 384Mi
        ports:
        - containerPort: 9909
          protocol: TCP
        - containerPort: 9567
          name: metrics
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/lib/kubelet
          mountPropagation: Bidirectional
          name: kubelet-dir
        - mountPath: /csi
          name: plugin-dir
        - mountPath: /dev
          name: device-dir
        - mountPath: /jfs
          mountPropagation: Bidirectional
          name: jfs-dir
        - mountPath: /root/.juicefs
          mountPropagation: Bidirectional
          name: jfs-root-dir
        - mountPath: /tmp
          name: jfs-fuse-fd
        - name: juicefs-config
          mountPath: /etc/config        
      - name: node-driver-registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0
        args:
        - --csi-address=$(ADDRESS)
        - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
        - --v=5
        - --health-port=9809
        ports:
          - containerPort: 9809
            name: healthz
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 5
          timeoutSeconds: 5
        env:
        - name: ADDRESS
          value: /csi/csi.sock
        - name: DRIVER_REG_SOCK_PATH
          value: /var/lib/kubelet/csi-plugins/csi.juicefs.com/csi.sock
        securityContext:
          privileged: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /csi
          name: plugin-dir
        - mountPath: /registration
          name: registration-dir
      - name: liveness-probe
        image: registry.k8s.io/sig-storage/livenessprobe:v2.12.0
        args:
        - --csi-address=$(ADDRESS)
        - --health-port=$(HEALTH_PORT)
        env:
        - name: ADDRESS
          value: /csi/csi.sock
        - name: HEALTH_PORT
          value: "9909"
        securityContext:
          privileged: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /csi
          name: plugin-dir
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      serviceAccount: juicefs-csi-node-sa
      volumes:
      - hostPath:
          path: /var/lib/kubelet
          type: Directory
        name: kubelet-dir
      - hostPath:
          path: /var/lib/kubelet/csi-plugins/csi.juicefs.com/
          type: DirectoryOrCreate
        name: plugin-dir
      - hostPath:
          path: /var/lib/kubelet/plugins_registry/
          type: Directory
        name: registration-dir
      - hostPath:
          path: /dev
          type: Directory
        name: device-dir
      - hostPath:
          path: /var/lib/juicefs/volume
          type: DirectoryOrCreate
        name: jfs-dir
      - hostPath:
          path: /var/lib/juicefs/config
          type: DirectoryOrCreate
        name: jfs-root-dir
      - hostPath:
          path: /var/run/juicefs-csi
          type: DirectoryOrCreate
        name: jfs-fuse-fd
      - name: juicefs-config
        configMap:
          name: juicefs-csi-driver-config
