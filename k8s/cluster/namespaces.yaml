# The one cluster's namespaces (docs/PLAN-cluster.md), from git like everything else on it.
# jarvis2-obs: only a Secret, the Grafana Cloud write credentials the host's Alloy reads (infra/alloy/).
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-obs
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: obs }
---
# jarvis2-edge: cloudflared of the tunnel jarvis2-cluster (only kernel-id.deyaochen.com, behind Access) and what it serves
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis2-edge
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: edge }
---
# jarvis4-router: the Jarvis 4 router (k8s/cluster/router), behind cloudflared in jarvis2-edge
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis4-router
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: router }
