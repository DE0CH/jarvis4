# alloy: Grafana Alloy on every node of the cluster except the server, as a DaemonSet, so a node infra/cluster-node.sh
# adds ships its pods' logs, its journal, its node metrics and its containers' metrics to Grafana from the moment it
# joins (docs/DESIGN.md "Logs and metrics"). The server (node-role control-plane) runs Alloy on its host instead
# (infra/cloud-init.sh), outside k3s, so it keeps shipping when the cluster doesn't; this DaemonSet stays off it.
#
# The pod runs the same module as the hosts, infra/alloy/box.alloy on main (import.git, every 5 min), with the host's
# / mounted at /host (pod logs, the journal, /proc, /sys, containerd's socket) and labels box="cluster",
# node=<the node's name>. Credentials: the Secret jarvis2-obs/alloy (k8s/cluster/secrets/alloy.enc.yaml). Its read
# positions and journal cursor live on the host (/var/lib/jarvis2-alloy), so a restarted pod doesn't ship twice.
# Privileged and on the host's network and PID namespace, like node-net: what Flux applies is already cluster admin.
apiVersion: v1
kind: ConfigMap
metadata: { name: alloy-node, namespace: jarvis2-obs }
data:
  config.alloy: |
    // stub (k8s/cluster/obs/alloy.yaml): the module is infra/alloy/box.alloy on main, pulled every 5 min
    import.git "jarvis4" {
      repository     = "https://github.com/DE0CH/jarvis4"
      revision       = "main"
      path           = "infra/alloy/box.alloy"
      pull_frequency = "5m"
    }
    jarvis4.main "node" {
      box       = "cluster"
      node      = sys.env("NODE_NAME")
      host_root = "/host"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: alloy, namespace: jarvis2-obs }
spec:
  selector: { matchLabels: { app: alloy } }
  updateStrategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1 } }
  template:
    metadata: { labels: { app: alloy } }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{ key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }]
      hostNetwork: true
      hostPID: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: system-node-critical
      tolerations: [{ operator: Exists }]
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=127.0.0.1:12345
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          envFrom: [{ secretRef: { name: alloy } }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/alloy, readOnly: true }
            - { name: data, mountPath: /var/lib/alloy/data }
            - { name: host, mountPath: /host, readOnly: true, mountPropagation: HostToContainer }
            # cAdvisor finds the cgroups through /sys/fs/cgroup, so the host's /sys goes there too
            - { name: sys, mountPath: /sys, readOnly: true }
          resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { memory: 300Mi } }
          securityContext: { privileged: true, runAsUser: 0 }
      volumes:
        - { name: cfg, configMap: { name: alloy-node } }
        - { name: data, hostPath: { path: /var/lib/jarvis2-alloy, type: DirectoryOrCreate } }
        - { name: host, hostPath: { path: /, type: Directory } }
        - { name: sys, hostPath: { path: /sys, type: Directory } }
---
# host-alloy: keeps the server's host Alloy importing its module from DE0CH/jarvis4 (the stub infra/cloud-init.sh writes;
# servers built before 2026-10-23 imported it from DE0CH/jarvis2). On the control-plane node only, every 60 s and
# idempotently, in the host's namespaces like node-net: when /etc/alloy/config.alloy differs from `stub`, it stops
# Alloy (which saves its read positions), drops Alloy's git clone of any other repository (import.git keeps the
# clone's origin otherwise), writes the stub and starts Alloy again. The stub's names stay "jarvis2"/"box", so the
# positions and the journal cursor carry over: no gap and nothing shipped twice. Its `node` is the hostname (the
# module's default), as the DaemonSet above sets it on the other nodes.
apiVersion: v1
kind: ConfigMap
metadata: { name: host-alloy, namespace: jarvis2-obs }
data:
  stub: |
    // stub: the module is infra/alloy/box.alloy on DE0CH/jarvis4 main, pulled every 5 min. The names "jarvis2" and
    // "box" stay as they are: Alloy keys its read positions and journal cursor by them.
    import.git "jarvis2" {
    repository     = "https://github.com/DE0CH/jarvis4"
    revision       = "main"
    path           = "infra/alloy/box.alloy"
    pull_frequency = "5m"
    }
    jarvis2.main "box" {
    box = "cluster"
    }
  host-alloy.sh: |
    set -u
    F=/etc/alloy/config.alloy
    [ -f "$F" ] || { echo "host-alloy: no host Alloy here"; exit 0; }
    [ "$(cat "$F")" = "$STUB" ] && exit 0
    systemctl stop alloy
    for c in $(find /var/lib/alloy -path '*/.git/config' 2>/dev/null); do
      grep -q 'url = https://github.com/DE0CH/jarvis4$' "$c" || { rm -rf "${c%/.git/config}"; echo "host-alloy: dropped the clone ${c%/.git/config}"; }
    done
    printf '%s\n' "$STUB" > "$F.new" && mv "$F.new" "$F"
    [ -f /etc/alloy/grafana.env ] && systemctl start alloy
    echo "host-alloy: the stub imports DE0CH/jarvis4 now; alloy $(systemctl is-active alloy)"
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: host-alloy, namespace: jarvis2-obs }
spec:
  selector: { matchLabels: { app: host-alloy } }
  updateStrategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1 } }
  template:
    metadata: { labels: { app: host-alloy } }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{ key: node-role.kubernetes.io/control-plane, operator: Exists }]
      hostPID: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: system-node-critical
      tolerations: [{ operator: Exists }]
      containers:
        - name: host-alloy
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - |
              while true; do
                nsenter -t 1 -m -u -i -n -p -- env STUB="$(cat /cfg/stub)" sh -c "$(cat /cfg/host-alloy.sh)"
                sleep 60
              done
          volumeMounts: [{ name: cfg, mountPath: /cfg, readOnly: true }]
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 32Mi } }
          securityContext: { privileged: true }
      volumes: [{ name: cfg, configMap: { name: host-alloy } }]
