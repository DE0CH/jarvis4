# OpenTofu for the tenants (Deyao, 2026-10-28: his Cloudflare login page is code in DE0CH/services): Flux tofu-controller
# runs the Terraform objects a tenant puts in its own namespace, each plan/apply in a runner pod there (service account
# tf-runner, made only in the namespaces values.yaml allows: services). Its own Flux Kustomization with wait, so the
# Terraform CRD exists before the services sync (tenants/services.yaml dependsOn) dry-runs a Terraform object.
# The vendored file is pinned: sha256 e5da6736292dfaf2bf3992263828c20d6784e138223142bad2ced38a428543d9
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: tofu-controller, namespace: flux-system }
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: jarvis4 }
  path: ./k8s/cluster/tofu-controller/controller
  prune: true
  wait: true
