apiVersion: v1
kind: Namespace
metadata:
  name: jarvis4-services
  labels: { pod-security.kubernetes.io/enforce: restricted, jarvis2/ns: services }
---
# watch 2 × 192 Mi, the iCloud index 2 × 2 Gi, rolling surges included (+1 of each)
apiVersion: v1
kind: ResourceQuota
metadata: { name: services, namespace: jarvis4-services }
spec:
  hard: { limits.memory: 10Gi, requests.memory: 3Gi, limits.cpu: "6", persistentvolumeclaims: "4", requests.storage: 60Gi }
