# A tenant on the cluster: Deyao's own services (DE0CH/services: transcript search), not part of Jarvis 4 (Deyao,
# 2026-10-24: Jarvis 4's job is secrets and the lifecycle of Fly containers and runners). Jarvis 4 only hosts them: the
# namespace `services`, its quota, and a Flux sync of that repo's k8s/ applied as flux-services, which is admin in
# `services` and nothing else, so nothing that repo holds can touch Jarvis. Its Secrets are SOPS-encrypted to the
# cluster's age key (keys/cluster-age.pub), decrypted with the same sops-age as k8s/cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: services
  labels: { pod-security.kubernetes.io/enforce: restricted }
---
# search 2 × 1 Gi + cloudflared 2 × 128 Mi + dsh-web 2 × 128 Mi, rolling surges included (+1 of each); the chat stack
# (Jarvis 4's aviary harness, DE0CH/jarvis4 aviary/README.md): pigeon, magpie, hermit-jarvis 2 × 256 Mi each (+1 surge),
# its Postgres chat-db 2 × 512 Mi (+ their Barman sidecars) on 2 × 10 Gi volumes
apiVersion: v1
kind: ResourceQuota
metadata: { name: services, namespace: services }
spec:
  hard: { limits.memory: 9Gi, requests.memory: 5Gi, limits.cpu: "8", persistentvolumeclaims: "4", requests.storage: 40Gi }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: flux-services, namespace: flux-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-services, namespace: services }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-services, namespace: flux-system }]
---
# a Role and its binding in the same apply: the dry run checks the binding before the Role exists, so flux-services
# needs bind (and escalate) on Roles in `services`, which still gives it nothing outside the namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: flux-services-rbac, namespace: services }
rules: [{ apiGroups: [rbac.authorization.k8s.io], resources: [roles], verbs: [bind, escalate] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-services-rbac, namespace: services }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: flux-services-rbac }
subjects: [{ kind: ServiceAccount, name: flux-services, namespace: flux-system }]
---
# the tenant's own Postgres (CloudNativePG, the cluster's operator): its Cluster, Database and Barman ObjectStore objects
# in `services` only (the operator's CRDs ship no role that aggregates to admin)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: flux-services-postgres, namespace: services }
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, databases, backups, scheduledbackups, poolers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-services-postgres, namespace: services }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: flux-services-postgres }
subjects: [{ kind: ServiceAccount, name: flux-services, namespace: flux-system }]
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: { name: services, namespace: flux-system }
spec:
  interval: 1m
  url: https://github.com/DE0CH/services
  ref: { branch: main }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: services, namespace: flux-system }
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef: { kind: GitRepository, name: services }
  path: ./k8s
  prune: true
  wait: false
  targetNamespace: services
  serviceAccountName: flux-services
  decryption:
    provider: sops
    secretRef: { name: sops-age }
