# The one cluster's SOPS-encrypted Secrets (only data/stringData; to keys/cluster-age.pub), decrypted by Flux with the
# cluster's age key. Written by infra/router-secrets.py --box cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alloy.enc.yaml
  - tunnel.enc.yaml
  - router.enc.yaml
  - router-wg.enc.yaml
  - router-flyvolumes.enc.yaml
  - postgres.enc.yaml
  - postgres-app.enc.yaml
  - router-backup.enc.yaml
  - router-db.enc.yaml
