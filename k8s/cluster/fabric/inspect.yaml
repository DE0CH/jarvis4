# A one-shot look at the fabric namespace from inside (no session reaches the cluster's API): the pods, their
# containers' states and the namespace's events, printed to the job's log (Grafana). Taken out with smoke.yaml.
apiVersion: v1
kind: ServiceAccount
metadata: { name: fabric-inspect, namespace: jarvis4-fabric }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: fabric-inspect, namespace: jarvis4-fabric }
rules:
  - { apiGroups: [""], resources: [pods, events], verbs: [get, list] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: fabric-inspect, namespace: jarvis4-fabric }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: fabric-inspect }
subjects: [{ kind: ServiceAccount, name: fabric-inspect, namespace: jarvis4-fabric }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: fabric-inspect-1, namespace: jarvis4-fabric }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: fabric-inspect } }
    spec:
      restartPolicy: Never
      serviceAccountName: fabric-inspect
      containers:
        - name: inspect
          image: bitnami/kubectl:1.33
          command: ["/bin/sh", "-c"]
          args:
            - |
              sleep 30
              kubectl -n jarvis4-fabric get pods -o wide
              for p in $(kubectl -n jarvis4-fabric get pods -l app=hermit -o name); do
                echo "== $p"; kubectl -n jarvis4-fabric get "$p" -o jsonpath='{range .status.initContainerStatuses[*]}init {.name}: ready={.ready} started={.started} {.state}{"\n"}{end}{range .status.containerStatuses[*]}{.name}: ready={.ready} {.state} restarts={.restartCount}{"\n"}{end}'
              done
              echo "== events"; kubectl -n jarvis4-fabric get events --sort-by=.lastTimestamp | tail -40
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
