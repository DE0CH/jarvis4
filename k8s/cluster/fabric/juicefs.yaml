# The fabric hermit's /jfs: a static PV for the JuiceFS volume jarvis4-fabric (metadata: database jfs on fabric-db, at
# 10.77.0.4 as the fabric hosts reach it; data: bucket jarvis4-fabric-6fdff6, prefix jarvis4-fabric/), mounted by the
# JuiceFS CSI driver's mount pods (k8s/cluster/juicefs-csi), as YYC AI's hermit has its /jfs (DE0CH/yyc-code
# yyc-ai/deploy/hermit/juicefs.yaml). Secret hermit-juicefs: infra/router-secrets.py --part fabric-jfs.
#
# Not an emptyDir with a FUSE sidecar (the earlier design): the kubelet measures an emptyDir by walking it, and a FUSE
# mount at the volume's root is walked whole. Once a session's files were on the volume (2026-11-19 04:05 UTC) every
# hermit pod passed the emptyDir's 16Mi limit and was evicted within a minute of starting, so a fabric session's start
# waited 5 minutes for a replica to stay up long enough to mark it ready.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jarvis4-fabric-jfs
  labels: { juicefs-volume: jarvis4-fabric }
spec:
  capacity: { storage: 1Pi }
  volumeMode: Filesystem
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: csi.juicefs.com
    volumeHandle: jarvis4-fabric
    fsType: juicefs
    nodePublishSecretRef: { name: hermit-juicefs, namespace: jarvis4-fabric }
  mountOptions: [no-usage-report, cache-size=0, open-cache=0, all-squash=1000:1000]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermit-jfs
  namespace: jarvis4-fabric
spec:
  accessModes: [ReadWriteMany]
  volumeMode: Filesystem
  resources: { requests: { storage: 1Pi } }
  storageClassName: ""
  selector:
    matchLabels: { juicefs-volume: jarvis4-fabric }
