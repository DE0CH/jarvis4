# The fabric hermit (docs/PLAN-fabric.md). Listed in k8s/cluster/kustomization.yaml once an aviary release holds the
# fabric's additions (hermit refuses hermit.json's sandbox.mounts and fabric.directEgress before it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - db.yaml
  - juicefs.yaml
  - hermit.yaml
  - secrets
images:
  # the aviary release (one commit for hermit and sandboxd: hermit.json fabric.sandboxd names the same release)
  - { name: hermit, newName: ghcr.io/de0ch/hermit, newTag: "dfb76508b12b", digest: sha256:9b87407c8e50788a2f92d5eea8b257ab7f5f15f69a5078a7472eab3434160446 }
configMapGenerator:
  - name: hermit-config
    namespace: jarvis4-fabric
    files:
      - hermit.json
      - catalogue.json
      - system-prompt.md
      - sandbox-rules.md
      - title-system.md
