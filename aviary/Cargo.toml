[package]
name = "jarvis-aviary"
description = "Jarvis 4's side of the aviary harness: hermit-jarvis (the hermit contract on Jarvis 4 sessions, with the central half of the sandbox gateway) and aviary-gateway (each session machine's half)."
version = "0.0.0"
edition = "2024"
# it links DE0CH/aviary's crates (AGPL-3.0-or-later)
license = "AGPL-3.0-or-later"
publish = false

# One aviary commit for every contract crate; bumped together with the images Jarvis 4's sessions and the services
# tenant run (aviary/README.md "Bumping aviary").
[dependencies]
aviary-core = { git = "https://github.com/DE0CH/aviary", rev = "8f4889a8fd99d60efa88574b584fa00f355dcd91" }
aviary-pg = { git = "https://github.com/DE0CH/aviary", rev = "8f4889a8fd99d60efa88574b584fa00f355dcd91" }
hermit-api = { git = "https://github.com/DE0CH/aviary", rev = "8f4889a8fd99d60efa88574b584fa00f355dcd91" }
gateway-api = { git = "https://github.com/DE0CH/aviary", rev = "8f4889a8fd99d60efa88574b584fa00f355dcd91" }
magpie-api = { git = "https://github.com/DE0CH/aviary", rev = "8f4889a8fd99d60efa88574b584fa00f355dcd91" }
supervisor-api = { git = "https://github.com/DE0CH/aviary", rev = "8f4889a8fd99d60efa88574b584fa00f355dcd91" }
anyhow = "=1.0.104"
axum = "=0.8.9"
base64 = "=0.23.1"
bytes = "1"
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1", "client"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "server", "http1"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "=1.54.1", features = ["full"] }
tracing = { version = "=0.1.44", features = ["release_max_level_info"] }
uuid = { version = "=1.29.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
aviary-fakes = { git = "https://github.com/DE0CH/aviary", rev = "8f4889a8fd99d60efa88574b584fa00f355dcd91" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
