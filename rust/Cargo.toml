# Jarvis 4 in Rust (Deyao, 2026-11-17: rewrite all of it from Go into Rust, part by part, with the same wire formats).
# Each crate replaces its Go part in one cut once it passes that part's tests and the e2e replica.
[workspace]
resolver = "3"
members = ["sig", "doc", "go", "machine", "e2e-kernel", "router", "replica-setup", "gate", "ios-ci"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# the router recovers a panicking request as Go's net/http does (a refused state write answers 503: state.rs
# StateWriteError, http.rs state_write_guard): its image builds with --profile router
[profile.router]
inherits = "release"
panic = "unwind"
