[package]
name = "jarvis-doc"
description = "The kernel's documents and permission pairs: objects, succession certs, the log notary's challenges, grants"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
jarvis-sig = { path = "../sig" }
p256 = { version = "0.13", features = ["hash2curve"] }
sha2 = "0.10"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting"] }

[dev-dependencies]
hex = "0.4"
rand = "0.8"

[lints]
workspace = true
