[package]
name = "jarvis-doc"
description = "The kernel's documents (kernel/doc) and permission pairs (kernel/perm): objects, succession certs, the log notary's challenges, grants"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
jarvis-sig = { path = "../sig" }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting"] }

[dev-dependencies]
rand = "0.8"

[lints]
workspace = true
