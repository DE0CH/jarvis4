[package]
name = "jarvis-kernel"
description = "Jarvis 4's kernel: the nine components, each a binary of its own (notary, notarizer, mover, merger, spawner, identity, gullible, minter, secrets)"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
jarvis-sig = { path = "../sig" }
jarvis-doc = { path = "../doc" }
jarvis-go = { path = "../go" }
jarvis-nethttp = { path = "../nethttp" }
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
quick-xml = { version = "0.37", features = ["serialize"] }
url = "2"
anyhow = "1"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
time = "0.3"
tokio-util = { version = "0.7" }
russh = { version = "0.54", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
