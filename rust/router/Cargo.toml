[package]
name = "jarvis-router"
description = "The Jarvis 4 router (router/ in Go): sessions from the core's primitives, the app's API, the machines' API"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "router"
path = "src/main.rs"

[dependencies]
jarvis-sig = { path = "../sig" }
jarvis-doc = { path = "../doc" }
jarvis-go = { path = "../go" }
jarvis-nethttp = { path = "../nethttp" }
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
boringtun = { version = "0.7", default-features = false }
bytes = "1"
ed25519-dalek = "2"
fallible-iterator = "0.2"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
include_dir = "0.7"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
minlz = "1.2"
nix = { version = "0.30", features = ["hostname"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
percent-encoding = "2"
postgres = { version = "0.19", features = ["with-time-0_3"] }
quick-xml = { version = "0.37", features = ["serialize"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = { version = "0.10", features = ["oid"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
tar = "0.4"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres-rustls = "0.13"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
unicode-general-category = "1"
url = "2"
uuid = "1"
x25519-dalek = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
