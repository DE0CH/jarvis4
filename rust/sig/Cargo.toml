[package]
name = "jarvis-sig"
description = "The kernel's cryptography: P-256 ECDSA over SHA-256 (DER, base64), signed documents, sealing to one public key (ephemeral ECDH + HKDF-SHA256 + AES-256-GCM)"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints]
workspace = true

[dev-dependencies]
hex = "0.4"
