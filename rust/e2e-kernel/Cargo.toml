[package]
name = "e2e-kernel"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "e2e-kernel"
path = "src/main.rs"

[dependencies]
jarvis-sig = { path = "../sig" }
jarvis-go = { path = "../go" }
anyhow = "1"
base64 = "0.22"
ring = "0.17"
nix = { version = "0.30", features = ["mount", "user", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde_json = "1.0"
postgres = "0.19"
sha2 = "0.10"
time = "0.3"
signal-hook = "0.3"

[lints]
workspace = true
