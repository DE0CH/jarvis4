[package]
name = "jarvis-go"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
jarvis-sig = { path = "../sig" }
anyhow = "1"
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[lints]
workspace = true
