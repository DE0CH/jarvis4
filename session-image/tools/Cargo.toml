[package]
name = "jarvis-tools"
version = "0.1.0"
edition = "2024"
description = "A Jarvis 4 session's own tools: schedule-wakeup, schedule-cron (its router crons), retire-session and aviary-sandbox"

[[bin]]
name = "jarvis-tools"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[profile.release]
strip = true
